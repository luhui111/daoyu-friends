<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>道谕 · 朋友试用</title>
  <style>
    :root { color-scheme: light; --paper: #f3eddd; --ink: #343126; --muted: #746d5d; --line: #d8cdb6; --phone-width: 390px; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Songti SC", "Noto Serif SC", "STSong", serif; }
    a, button { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-underline-offset: 4px; }
    button { font: inherit; }
    .intro { max-width: 760px; margin: 0 auto; padding: 24px 22px 16px; text-align: center; }
    .eyebrow { margin: 0 0 9px; font: 11px/1.6 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 31px); font-weight: 500; letter-spacing: .06em; }
    .description { margin: 10px auto 0; font-size: 13px; line-height: 1.85; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 20px; padding: 0 16px 16px; }
    .sizes { display: flex; gap: 5px; }
    .sizes button { min-height: 38px; min-width: 53px; padding: 7px 10px; border: 1px solid var(--line); background: transparent; border-radius: 3px; color: var(--muted); cursor: pointer; font: 12px/1.5 ui-sans-serif, system-ui, sans-serif; }
    .sizes button[aria-pressed="true"] { background: var(--ink); color: #fcf8ed; border-color: var(--ink); }
    .open { display: inline-flex; align-items: center; min-height: 38px; font-size: 13px; }
    :is(button, a):focus-visible { outline: 2px solid #795f40; outline-offset: 4px; }
    main { padding: 0 18px 20px; }
    .phone { width: calc(var(--phone-width) + 2px); max-width: 100%; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: #faf7ed; box-shadow: 0 10px 40px #66502e0c; }
    iframe { display: block; width: 100%; height: clamp(520px, calc(100dvh - 208px), 844px); border: 0; background: #faf7ed; }
    .note { margin: 12px 0 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .note a { margin-left: 12px; }
    @media (max-width: 480px) {
      .intro { padding: 19px 20px 12px; }
      .eyebrow { font-size: 10px; }
      .description { font-size: 12px; }
      .toolbar { padding-bottom: 13px; }
      .sizes { display: none; }
      main { padding: 0 0 env(safe-area-inset-bottom); }
      .phone { width: 100%; max-width: none; border-radius: 0; border-left: 0; border-right: 0; box-shadow: none; }
      iframe { height: max(520px, calc(100dvh - 182px)); }
      .note { padding: 0 18px 14px; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <p class="eyebrow">道谕 · 手机网页版试用</p>
    <h1>试一试你的命盘</h1>
    <p class="description">可以试排盘、切换宫位和建档，凭试用码生成 AI 解读。<br>档案保存在当前浏览器；支付暂未开放。</p>
  </header>
  <div class="toolbar">
    <div class="sizes" role="group" aria-label="选择预览宽度">
      <button type="button" data-width="320" aria-pressed="false" aria-label="窄屏，320像素">320</button>
      <button type="button" data-width="390" aria-pressed="true" aria-label="标准手机，390像素">390</button>
      <button type="button" data-width="430" aria-pressed="false" aria-label="宽屏手机，430像素">430</button>
    </div>
    <a class="open" id="open-page" href="/daoyu-friends/dashboard/" target="_blank" rel="noopener">单独打开当前页面 ↗</a>
  </div>
  <main>
    <div class="phone">
      <iframe id="preview" src="/daoyu-friends/dashboard/" title="手机网页版，可通过页面底部导航浏览首页、命盘、问事、档案和我的"></iframe>
    </div>
    <p class="note">通过页面底部导航切换功能。<a href="/daoyu-friends/dashboard/">返回网站</a></p>
  </main>
  <script>
    (() => {
      const preview = document.getElementById('preview');
      const openPage = document.getElementById('open-page');
      const routes = { home: '/daoyu-friends/dashboard/', chart: '/daoyu-friends/ziwei/', liuyao: '/daoyu-friends/liuyao/', archive: '/daoyu-friends/database/', profile: '/daoyu-friends/profile/' };
      const requested = new URL(location.href).searchParams.get('page') || 'chart';
      if (matchMedia('(max-width: 600px)').matches) { location.replace(routes[requested] || routes.chart); return; }
      if (routes[requested]) {
        preview.src = routes[requested];
        openPage.href = routes[requested];
      }
      document.querySelectorAll('[data-width]').forEach(button => {
        button.addEventListener('click', () => {
          document.documentElement.style.setProperty('--phone-width', button.dataset.width + 'px');
          document.querySelectorAll('[data-width]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
        });
      });
      function syncCurrentPage() {
        try {
          const url = new URL(preview.contentWindow.location.href);
          if (url.origin === location.origin && url.pathname !== '/daoyu-friends/review/mobile-preview.html') openPage.href = url.pathname + url.search + url.hash;
        } catch (_) { /* A navigation outside this site keeps the last local link. */ }
      }
      preview.addEventListener('load', syncCurrentPage);
      openPage.addEventListener('click', syncCurrentPage);
    })();
  </script>
</body>
</html>
